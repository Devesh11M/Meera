<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Embed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        iframe {
            width: 100%;
            max-width: 800px;
            height: 450px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>My YouTube Playlist</h1>

    <!-- Replace PLAYLIST_ID with your actual playlist ID -->

        src="https://www.youtube.com/embed/videoseries?list=PLYazKoZJJto_fOBHijYa1fWwZK7l0SVy5" 
        allowfullscreen>
    </iframe>

</body>
